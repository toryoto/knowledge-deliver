services:
  agent-server:
    build: ./agent-server
    ports:
      - "3000:3000"
    env_file: ./agent-server/.env
    volumes:
      - vault-data:/vault
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  slack-bot:
    build: ./slack-bot
    env_file: ./slack-bot/.env
    depends_on:
      agent-server:
        condition: service_started

  pipeline:
    build: ./pipeline
    environment:
      - AGENT_ENDPOINT_URL=http://agent-server:3000
      - REDIS_URL=redis://redis:6379
    env_file:
      - ./pipeline/.env
    depends_on:
      - agent-server
      - redis

volumes:
  vault-data:
