services:
  agent-server:
    build: ./agent-server
    ports:
      - "3000:3000"
    env_file: ./agent-server/.env
    volumes:
      - vault-data:/vault
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  vault-data:
